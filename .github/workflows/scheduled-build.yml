name: scheduled-build
on:
  schedule:
    # 毎週月曜 09:00 JST（00:00 UTC）。失敗すると Actions の実行が失敗になり、Watch の通知で分かる
    - cron: "0 0 * * 1"
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci
      # いまは demo のまま。本番では DD_MODE=production を env に足す（apps/site/docs/deploy.md）。
      # URL は slug から https://business.jitty.jp/<slug> になるので、DD_SITE_URL は全サイトに効くここでは使わない

      - run: npm run build:all
      - name: deploy hook
        if: success()
        env:
          DEPLOY_HOOK_URL: ${{ secrets.DEPLOY_HOOK_URL }}
        run: |
          if [ -n "$DEPLOY_HOOK_URL" ]; then
            curl -fsS -X POST "$DEPLOY_HOOK_URL"
          fi
